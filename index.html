<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouSimulator - YouTube Channel Simulator</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --text-color: #f1f1f1;
            --text-secondary: #aaa;
            --accent-color: #cc0000;
            --hover-color: #272727;
            --border-color: #3f3f3f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .logo-icon {
            background-color: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background-color: #272727;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #3f3f3f;
        }

        .btn-primary {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
        }

        .btn-primary:hover {
            background-color: #d9d9d9;
        }

        .btn-danger {
            background-color: #8b0000;
            color: white;
            border: none;
        }

        .btn-danger:hover {
            background-color: #a00000;
        }

        .channel-select {
            background-color: #272727;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        .main-container {
            display: flex;
            flex: 1;
        }

        nav {
            width: 220px;
            padding: 12px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--hover-color);
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .channel-header {
            margin-bottom: 24px;
        }

        .channel-banner {
            width: 100%;
            height: 180px;
            background-color: #272727;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 16px;
        }

        .channel-details {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .channel-info-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .channel-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #3f3f3f;
            object-fit: cover;
        }

        .channel-meta h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .channel-meta p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .sub-tabs {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .sub-tab {
            padding: 10px 0;
            cursor: pointer;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            font-weight: 500;
        }

        .sub-tab.active {
            color: var(--text-color);
            border-bottom-color: var(--text-color);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .video-card {
            display: flex;
            flex-direction: column;
            cursor: grab;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--card-bg);
            transition: transform 0.2s, opacity 0.2s, border-color 0.2s;
            border: 2px solid transparent;
        }

        .video-card:active {
            cursor: grabbing;
        }

        .video-card.dragging {
            opacity: 0.4;
            border-color: var(--accent-color);
        }

        .video-card.drag-over {
            border-color: var(--text-color);
            transform: scale(1.02);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #272727;
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-stats {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            padding: 0 12px 12px 12px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select {
            background-color: #272727;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .modal-buttons-right {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .player-modal-content {
            max-width: 900px;
            width: 90%;
            padding: 16px;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: black;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="goHomeBtn">
            <span class="logo-icon">▶</span> YouSimulator
        </div>
        <div class="header-actions">
            <select id="channelSelect" class="channel-select"></select>
            <button class="btn" id="addChannelBtn">+ Новый Канал</button>
            <button class="btn btn-primary" id="openAdminBtn">Админ Панель</button>
        </div>
    </header>

    <div class="main-container">
        <nav>
            <div class="nav-item active" id="navHome">🏠 Главная</div>
            <div class="nav-item" id="navChannel">👤 Мой Канал</div>
        </nav>

        <div class="content">
            <div id="viewHome">
                <h2 style="margin-bottom: 16px;">Рекомендации</h2>
                <div class="video-grid" id="homeVideoGrid"></div>
            </div>

            <div id="viewChannel" style="display: none;">
                <div class="channel-header">
                    <img id="chBanner" class="channel-banner" src="" alt="Banner">
                    <div class="channel-details">
                        <div class="channel-info-group">
                            <img id="chAvatar" class="channel-avatar" src="" alt="Avatar">
                            <div class="channel-meta">
                                <h1 id="chName">Название канала</h1>
                                <p id="chSubs">0 подписчиков</p>
                            </div>
                        </div>
                        <button class="btn" id="editChannelSettingsBtn">⚙️ Настройки канала</button>
                    </div>
                </div>

                <div class="sub-tabs">
                    <div class="sub-tab active" id="tabVideos">Видео</div>
                    <div class="sub-tab" id="tabStreams">Стримы</div>
                </div>

                <p style="color: #666; font-size: 0.8rem; margin-bottom: 12px;">💡 Зажми карточку и перетащи её, чтобы изменить порядок роликов</p>
                <div class="video-grid" id="channelVideoGrid"></div>
            </div>
        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 id="modalTitle">Добавить / Редактировать контент</h2>
            <input type="hidden" id="editVideoId" value="">

            <div class="form-group">
                <label>Канал для публикации</label>
                <select id="adminChannelSelect"></select>
            </div>

            <div class="form-group">
                <label>Тип контента</label>
                <select id="contentType">
                    <option value="video">Видео</option>
                    <option value="stream">Стрим</option>
                </select>
            </div>

            <div class="form-group">
                <label>Название</label>
                <input type="text" id="contentTitle" placeholder="Введите название...">
            </div>

            <div class="form-group">
                <label>Просмотры</label>
                <input type="text" id="contentViews" placeholder="Например: 125 тыс. просмотров">
            </div>

            <div class="form-group">
                <label>Обложка (Файл с ПК или URL)</label>
                <input type="file" id="contentThumbFile" accept="image/*">
                <input type="text" id="contentThumbnail" placeholder="Или ссылка на обложку (URL)">
            </div>

            <div class="form-group">
                <label>Видеофайл (MP4, MKV, WebM)</label>
                <input type="file" id="contentVideoFile" accept="video/*,.mkv">
            </div>

            <div class="modal-actions">
                <div class="modal-buttons-right">
                    <button class="btn" id="closeAdminBtn">Отмена</button>
                    <button class="btn btn-primary" id="saveContentBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CHANNEL MODAL -->
    <div class="modal" id="channelModal">
        <div class="modal-content">
            <h2 id="channelModalTitle">Создать новый канал</h2>
            <input type="hidden" id="editChannelId" value="">

            <div class="form-group">
                <label>Название канала</label>
                <input type="text" id="newChName" placeholder="Мой игровой канал">
            </div>
            <div class="form-group">
                <label>Подписчики</label>
                <input type="text" id="newChSubs" placeholder="Например: 150 тыс.">
            </div>
            <div class="form-group">
                <label>Аватарка (Файл с ПК или URL)</label>
                <input type="file" id="newChAvatarFile" accept="image/*">
                <input type="text" id="newChAvatar" placeholder="Или URL аватарки">
            </div>
            <div class="form-group">
                <label>Баннер (Файл с ПК или URL)</label>
                <input type="file" id="newChBannerFile" accept="image/*">
                <input type="text" id="newChBanner" placeholder="Или URL баннера">
            </div>

            <div class="modal-actions">
                <button class="btn btn-danger" id="deleteChannelBtn" style="display: none;">Удалить канал</button>
                <div class="modal-buttons-right">
                    <button class="btn" id="closeChannelBtn">Отмена</button>
                    <button class="btn btn-primary" id="saveChannelBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYER MODAL -->
    <div class="modal" id="playerModal">
        <div class="modal-content player-modal-content">
            <video id="mainVideoPlayer" controls autoplay></video>
            <h3 id="playerTitle" style="margin-top: 10px;"></h3>
            <p id="playerStats" style="color: #aaa; font-size: 0.9rem; margin-top: 4px;"></p>
            <div class="modal-actions" style="margin-top: 15px;">
                <div class="modal-buttons-right">
                    <button class="btn" id="closePlayerBtn">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DB_NAME = 'YouSimulatorDB';
        const STORE_NAME = 'videos';

        function openDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = () => resolve(null);
            });
        }

        async function saveVideoFile(id, blob) {
            try {
                const db = await openDB();
                if (!db) return;
                return new Promise((res) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).put({ id: id, blob: blob });
                    tx.oncomplete = () => res();
                    tx.onerror = () => res();
                });
            } catch (err) {}
        }

        async function getVideoFile(id) {
            try {
                const db = await openDB();
                if (!db) return null;
                return new Promise((res) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(id);
                    req.onsuccess = () => res(req.result ? req.result.blob : null);
                    req.onerror = () => res(null);
                });
            } catch (err) {
                return null;
            }
        }

        async function deleteVideoFile(id) {
            try {
                const db = await openDB();
                if (!db) return;
                return new Promise((res) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).delete(id);
                    tx.oncomplete = () => res();
                    tx.onerror = () => res();
                });
            } catch (err) {}
        }

        function readFileAsDataURL(file) {
            return new Promise((res) => {
                if (!file) return res(null);
                const reader = new FileReader();
                reader.onload = (e) => res(e.target.result);
                reader.onerror = () => res(null);
                reader.readAsDataURL(file);
            });
        }

        let channels = JSON.parse(localStorage.getItem('yt_channels')) || [];
        let videos = JSON.parse(localStorage.getItem('yt_videos')) || [];
        let currentChannelId = localStorage.getItem('yt_current_channel') || '';
        let activeTab = 'videos';
        let draggedVideoId = null;

        function initData() {
            if (channels.length === 0) {
                channels.push({
                    id: 'ch_' + Date.now(),
                    name: 'Мой Канал',
                    avatar: '',
                    banner: '',
                    subscribers: '100 тыс.'
                });
            }
            if (!currentChannelId || !channels.find(c => c.id === currentChannelId)) {
                currentChannelId = channels[0].id;
            }
            saveState();
        }

        function saveState() {
            localStorage.setItem('yt_channels', JSON.stringify(channels));
            localStorage.setItem('yt_videos', JSON.stringify(videos));
            localStorage.setItem('yt_current_channel', currentChannelId);
        }

        function getCurrentChannel() {
            return channels.find(c => c.id === currentChannelId) || channels[0];
        }

        function populateSelects() {
            const mainSel = document.getElementById('channelSelect');
            const adminSel = document.getElementById('adminChannelSelect');
            if (!mainSel || !adminSel) return;
            mainSel.innerHTML = '';
            adminSel.innerHTML = '';

            channels.forEach(ch => {
                const opt1 = document.createElement('option');
                opt1.value = ch.id;
                opt1.textContent = ch.name;
                if (ch.id === currentChannelId) opt1.selected = true;
                mainSel.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = ch.id;
                opt2.textContent = ch.name;
                adminSel.appendChild(opt2);
            });
        }

        function renderHeader() {
            const ch = getCurrentChannel();
            if (!ch) return;
            document.getElementById('chBanner').src = ch.banner || 'https://via.placeholder.com/800x180/272727/ffffff?text=Banner';
            document.getElementById('chAvatar').src = ch.avatar || 'https://via.placeholder.com/80/3f3f3f/ffffff?text=Avatar';
            document.getElementById('chName').textContent = ch.name;
            document.getElementById('chSubs').textContent = (ch.subscribers || '0') + ' подписчиков';
        }

        function createCard(video, isChannelView = false) {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.setAttribute('data-id', video.id);

            if (isChannelView) {
                card.setAttribute('draggable', 'true');
            }

            const thumb = video.thumbnail || 'https://via.placeholder.com/320x180/272727/ffffff?text=No+Thumb';

            card.innerHTML = `
                <div class="thumbnail-container">
                    <img src="${thumb}" class="thumbnail" alt="Thumb">
                </div>
                <div class="video-info">
                    <div class="video-title">${video.title}</div>
                    <div class="video-stats">${video.views} • ${video.date || 'Недавно'}</div>
                </div>
            `;

            card.addEventListener('click', (e) => {
                if (!e.target.classList.contains('btn-edit') && !e.target.classList.contains('btn-del')) {
                    playVideo(video.id);
                }
            });

            if (isChannelView) {
                card.addEventListener('dragstart', (e) => {
                    draggedVideoId = video.id;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    document.querySelectorAll('.video-card').forEach(c => c.classList.remove('drag-over'));
                });

                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    if (draggedVideoId !== video.id) {
                        card.classList.add('drag-over');
                    }
                });

                card.addEventListener('dragleave', () => {
                    card.classList.remove('drag-over');
                });

                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    card.classList.remove('drag-over');

                    if (draggedVideoId && draggedVideoId !== video.id) {
                        const fromIndex = videos.findIndex(v => v.id === draggedVideoId);
                        const toIndex = videos.findIndex(v => v.id === video.id);

                        if (fromIndex !== -1 && toIndex !== -1) {
                            const [movedItem] = videos.splice(fromIndex, 1);
                            videos.splice(toIndex, 0, movedItem);
                            saveState();
                            renderChannel();
                            renderHome();
                        }
                    }
                });

                const actions = document.createElement('div');
                actions.className = 'card-actions';
                
                const btnEdit = document.createElement('button');
                btnEdit.className = 'btn btn-sm btn-edit';
                btnEdit.textContent = '✏️';
                btnEdit.addEventListener('click', () => editContent(video.id));

                const btnDel = document.createElement('button');
                btnDel.className = 'btn btn-sm btn-danger btn-del';
                btnDel.style.marginLeft = '6px';
                btnDel.textContent = '🗑️';
                btnDel.addEventListener('click', () => removeContent(video.id));

                actions.appendChild(btnEdit);
                actions.appendChild(btnDel);
                card.appendChild(actions);
            }

            return card;
        }

        function renderHome() {
            const grid = document.getElementById('homeVideoGrid');
            if (!grid) return;
            grid.innerHTML = '';
            if (videos.length === 0) {
                grid.innerHTML = '<p style="color:#aaa;">Нет видео</p>';
                return;
            }
            videos.forEach(v => grid.appendChild(createCard(v, false)));
        }

        function renderChannel() {
            const grid = document.getElementById('channelVideoGrid');
            if (!grid) return;
            grid.innerHTML = '';
            const targetType = (activeTab === 'streams') ? 'stream' : 'video';
            const filtered = videos.filter(v => v.channelId === currentChannelId && (v.type || 'video') === targetType);

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color:#aaa;">Раздел пуст</p>`;
                return;
            }
            filtered.forEach(v => grid.appendChild(createCard(v, true)));
        }

        async function playVideo(id) {
            const v = videos.find(item => item.id === id);
            if (!v) return;
            const modal = document.getElementById('playerModal');
            const player = document.getElementById('mainVideoPlayer');
            document.getElementById('playerTitle').textContent = v.title;
            document.getElementById('playerStats').textContent = `${v.views} • ${v.date || 'Сегодня'}`;

            const blob = await getVideoFile(id);
            if (blob) {
                player.src = URL.createObjectURL(blob);
            } else {
                player.src = '';
            }
            modal.classList.add('active');
        }

        document.getElementById('closePlayerBtn').addEventListener('click', () => {
            const player = document.getElementById('mainVideoPlayer');
            player.pause();
            player.src = '';
            document.getElementById('playerModal').classList.remove('active');
        });

        const adminModal = document.getElementById('adminModal');

        document.getElementById('openAdminBtn').addEventListener('click', () => {
            document.getElementById('modalTitle').textContent = 'Добавить контент';
            document.getElementById('editVideoId').value = '';
            document.getElementById('contentTitle').value = '';
            document.getElementById('contentViews').value = '';
            document.getElementById('contentThumbnail').value = '';
            document.getElementById('contentThumbFile').value = '';
            document.getElementById('contentVideoFile').value = '';
            adminModal.classList.add('active');
        });

        document.getElementById('closeAdminBtn').addEventListener('click', () => adminModal.classList.remove('active'));

        function editContent(id) {
            const v = videos.find(item => item.id === id);
            if (!v) return;
            document.getElementById('modalTitle').textContent = 'Редактировать контент';
            document.getElementById('editVideoId').value = v.id;
            document.getElementById('adminChannelSelect').value = v.channelId || currentChannelId;
            document.getElementById('contentType').value = v.type || 'video';
            document.getElementById('contentTitle').value = v.title;
            document.getElementById('contentViews').value = v.views;
            document.getElementById('contentThumbnail').value = v.thumbnail || '';
            document.getElementById('contentThumbFile').value = '';
            document.getElementById('contentVideoFile').value = '';
            adminModal.classList.add('active');
        }

        async function removeContent(id) {
            if (confirm('Удалить контент?')) {
                videos = videos.filter(v => v.id !== id);
                await deleteVideoFile(id);
                saveState();
                renderChannel();
                renderHome();
            }
        }

        // АБСОЛЮТНО БЕЗОПАСНОЕ СОХРАНЕНИЕ
        document.getElementById('saveContentBtn').addEventListener('click', async () => {
            try {
                const editId = document.getElementById('editVideoId').value;
                const chId = document.getElementById('adminChannelSelect').value;
                const type = document.getElementById('contentType').value;
                const title = document.getElementById('contentTitle').value.trim();
                const views = document.getElementById('contentViews').value.trim() || '0 просмотров';
                let thumb = document.getElementById('contentThumbnail').value.trim();

                if (!title) {
                    alert('Введите название!');
                    return;
                }

                const thumbFile = document.getElementById('contentThumbFile').files[0];
                if (thumbFile) {
                    const data = await readFileAsDataURL(thumbFile);
                    if (data) thumb = data;
                }

                const videoFile = document.getElementById('contentVideoFile').files[0];

                if (editId) {
                    const idx = videos.findIndex(v => v.id === editId);
                    if (idx !== -1) {
                        videos[idx].channelId = chId;
                        videos[idx].type = type;
                        videos[idx].title = title;
                        videos[idx].views = views;
                        if (thumb) videos[idx].thumbnail = thumb;
                        if (videoFile) {
                            await saveVideoFile(editId, videoFile);
                        }
                    }
                } else {
                    const newId = 'vid_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                    if (videoFile) {
                        await saveVideoFile(newId, videoFile);
                    }
                    videos.unshift({
                        id: newId,
                        channelId: chId,
                        type: type,
                        title: title,
                        views: views,
                        thumbnail: thumb || '',
                        date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })
                    });
                }

                currentChannelId = chId;
                activeTab = (type === 'stream') ? 'streams' : 'videos';
                document.getElementById('tabVideos').classList.toggle('active', activeTab === 'videos');
                document.getElementById('tabStreams').classList.toggle('active', activeTab === 'streams');

                saveState();
                populateSelects();
                adminModal.classList.remove('active');
                renderHeader();
                renderChannel();
                renderHome();
            } catch (err) {
                console.error(err);
                adminModal.classList.remove('active');
            }
        });

        const channelModal = document.getElementById('channelModal');
        const deleteChBtn = document.getElementById('deleteChannelBtn');

        document.getElementById('addChannelBtn').addEventListener('click', () => {
            document.getElementById('channelModalTitle').textContent = 'Создать новый канал';
            document.getElementById('editChannelId').value = '';
            document.getElementById('newChName').value = '';
            document.getElementById('newChSubs').value = '0';
            document.getElementById('newChAvatar').value = '';
            document.getElementById('newChAvatarFile').value = '';
            document.getElementById('newChBanner').value = '';
            document.getElementById('newChBannerFile').value = '';
            deleteChBtn.style.display = 'none';
            channelModal.classList.add('active');
        });

        document.getElementById('editChannelSettingsBtn').addEventListener('click', () => {
            const ch = getCurrentChannel();
            if (!ch) return;
            document.getElementById('channelModalTitle').textContent = 'Настройки канала';
            document.getElementById('editChannelId').value = ch.id;
            document.getElementById('newChName').value = ch.name;
            document.getElementById('newChSubs').value = ch.subscribers || '0';
            document.getElementById('newChAvatar').value = ch.avatar || '';
            document.getElementById('newChAvatarFile').value = '';
            document.getElementById('newChBanner').value = ch.banner || '';
            document.getElementById('newChBannerFile').value = '';
            deleteChBtn.style.display = 'block';
            channelModal.classList.add('active');
        });

        document.getElementById('closeChannelBtn').addEventListener('click', () => channelModal.classList.remove('active'));

        document.getElementById('saveChannelBtn').addEventListener('click', async () => {
            try {
                const editId = document.getElementById('editChannelId').value;
                const name = document.getElementById('newChName').value.trim();
                const subs = document.getElementById('newChSubs').value.trim() || '0';
                let avatar = document.getElementById('newChAvatar').value.trim();
                let banner = document.getElementById('newChBanner').value.trim();

                if (!name) {
                    alert('Введите название!');
                    return;
                }

                const avFile = document.getElementById('newChAvatarFile').files[0];
                if (avFile) {
                    const res = await readFileAsDataURL(avFile);
                    if (res) avatar = res;
                }

                const bnFile = document.getElementById('newChBannerFile').files[0];
                if (bnFile) {
                    const res = await readFileAsDataURL(bnFile);
                    if (res) banner = res;
                }

                if (editId) {
                    const idx = channels.findIndex(c => c.id === editId);
                    if (idx !== -1) {
                        channels[idx].name = name;
                        channels[idx].subscribers = subs;
                        if (avatar) channels[idx].avatar = avatar;
                        if (banner) channels[idx].banner = banner;
                    }
                } else {
                    const newCh = { id: 'ch_' + Date.now(), name: name, subscribers: subs, avatar: avatar, banner: banner };
                    channels.push(newCh);
                    currentChannelId = newCh.id;
                }

                saveState();
                populateSelects();
                renderHeader();
                renderChannel();
                channelModal.classList.remove('active');
            } catch (err) {
                channelModal.classList.remove('active');
            }
        });

        deleteChBtn.addEventListener('click', async () => {
            const editId = document.getElementById('editChannelId').value;
            if (!editId) return;
            if (confirm('Удалить канал и все его ролики?')) {
                const chVids = videos.filter(v => v.channelId === editId);
                for (const v of chVids) await deleteVideoFile(v.id);
                videos = videos.filter(v => v.channelId !== editId);
                channels = channels.filter(c => c.id !== editId);

                if (channels.length > 0) {
                    currentChannelId = channels[0].id;
                } else {
                    currentChannelId = '';
                    initData();
                }

                saveState();
                populateSelects();
                renderHeader();
                renderChannel();
                renderHome();
                channelModal.classList.remove('active');
            }
        });

        document.getElementById('channelSelect').addEventListener('change', (e) => {
            currentChannelId = e.target.value;
            saveState();
            renderHeader();
            renderChannel();
        });

        function switchView(view) {
            document.getElementById('viewHome').style.display = (view === 'home') ? 'block' : 'none';
            document.getElementById('viewChannel').style.display = (view === 'channel') ? 'block' : 'none';
            document.getElementById('navHome').classList.toggle('active', view === 'home');
            document.getElementById('navChannel').classList.toggle('active', view === 'channel');
            if (view === 'home') renderHome();
            else { renderHeader(); renderChannel(); }
        }

        document.getElementById('goHomeBtn').addEventListener('click', () => switchView('home'));
        document.getElementById('navHome').addEventListener('click', () => switchView('home'));
        document.getElementById('navChannel').addEventListener('click', () => switchView('channel'));

        document.getElementById('tabVideos').addEventListener('click', () => {
            activeTab = 'videos';
            document.getElementById('tabVideos').classList.add('active');
            document.getElementById('tabStreams').classList.remove('active');
            renderChannel();
        });

        document.getElementById('tabStreams').addEventListener('click', () => {
            activeTab = 'streams';
            document.getElementById('tabStreams').classList.add('active');
            document.getElementById('tabVideos').classList.remove('active');
            renderChannel();
        });

        initData();
        populateSelects();
        switchView('home');
    </script>
</body>
</html>
