<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouSimulator - YouTube Channel Simulator</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1f1f1f;
            --text-color: #f1f1f1;
            --text-secondary: #aaa;
            --accent-color: #cc0000;
            --hover-color: #272727;
            --border-color: #3f3f3f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .logo-icon {
            background-color: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background-color: #272727;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #3f3f3f;
        }

        .btn-primary {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
        }

        .btn-primary:hover {
            background-color: #d9d9d9;
        }

        .btn-danger {
            background-color: #8b0000;
            color: white;
            border: none;
        }

        .btn-danger:hover {
            background-color: #a00000;
        }

        /* CHANNEL SELECTOR DROPDOWN */
        .channel-select {
            background-color: #272727;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        /* MAIN CONTENT AREA */
        .main-container {
            display: flex;
            flex: 1;
        }

        /* NAVIGATION TABS */
        nav {
            width: 220px;
            padding: 12px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--hover-color);
        }

        /* CONTENT VIEW */
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* CHANNEL BANNER & INFO */
        .channel-header {
            margin-bottom: 24px;
        }

        .channel-banner {
            width: 100%;
            height: 180px;
            background-color: #272727;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 16px;
        }

        .channel-details {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .channel-info-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .channel-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #3f3f3f;
            object-fit: cover;
        }

        .channel-meta h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .channel-meta p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* TABS (VIDEOS / STREAMS) */
        .sub-tabs {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .sub-tab {
            padding: 10px 0;
            cursor: pointer;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            font-weight: 500;
        }

        .sub-tab.active {
            color: var(--text-color);
            border-bottom-color: var(--text-color);
        }

        /* VIDEO GRID */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .video-card {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--card-bg);
            transition: transform 0.2s;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #272727;
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-clamp: 2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-stats {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            padding: 0 12px 12px 12px;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        /* MODAL WINDOWS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select {
            background-color: #272727;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .modal-buttons-right {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        /* PLAYER MODAL */
        .player-modal-content {
            max-width: 900px;
            width: 90%;
            padding: 16px;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: black;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo" id="goHomeBtn">
            <span class="logo-icon">▶</span> YouSimulator
        </div>
        <div class="header-actions">
            <!-- Выбор текущего канала -->
            <select id="channelSelect" class="channel-select"></select>
            <button class="btn" id="addChannelBtn">+ Новый Канал</button>
            <button class="btn btn-primary" id="openAdminBtn">Админ Панель</button>
        </div>
    </header>

    <div class="main-container">
        <!-- NAVIGATION -->
        <nav>
            <div class="nav-item active" id="navHome">🏠 Главная</div>
            <div class="nav-item" id="navChannel">👤 Мой Канал</div>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="content">
            
            <!-- VIEW: HOME FEED -->
            <div id="viewHome">
                <h2 style="margin-bottom: 16px;">Рекомендации</h2>
                <div class="video-grid" id="homeVideoGrid"></div>
            </div>

            <!-- VIEW: CHANNEL PAGE -->
            <div id="viewChannel" style="display: none;">
                <div class="channel-header">
                    <img id="chBanner" class="channel-banner" src="" alt="Banner">
                    <div class="channel-details">
                        <div class="channel-info-group">
                            <img id="chAvatar" class="channel-avatar" src="" alt="Avatar">
                            <div class="channel-meta">
                                <h1 id="chName">Название канала</h1>
                                <p id="chSubs">0 подписчиков</p>
                            </div>
                        </div>
                        <button class="btn" id="editChannelSettingsBtn">⚙️ Настройки канала</button>
                    </div>
                </div>

                <div class="sub-tabs">
                    <div class="sub-tab active" id="tabVideos">Видео</div>
                    <div class="sub-tab" id="tabStreams">Стримы</div>
                </div>

                <div class="video-grid" id="channelVideoGrid"></div>
            </div>

        </div>
    </div>

    <!-- MODAL: ADMIN PANEL (ADD / EDIT CONTENT) -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 id="modalTitle">Добавить / Редактировать контент</h2>
            
            <input type="hidden" id="editVideoId" value="">

            <div class="form-group">
                <label>Канал для публикации</label>
                <select id="adminChannelSelect"></select>
            </div>

            <div class="form-group">
                <label>Тип контента</label>
                <select id="contentType">
                    <option value="video">Видео</option>
                    <option value="stream">Стрим</option>
                </select>
            </div>

            <div class="form-group">
                <label>Название</label>
                <input type="text" id="contentTitle" placeholder="Введите название...">
            </div>

            <div class="form-group">
                <label>Просмотры</label>
                <input type="text" id="contentViews" placeholder="Например: 125 тыс. просмотров">
            </div>

            <div class="form-group">
                <label>Превью (Картинка URL или DataURL)</label>
                <input type="text" id="contentThumbnail" placeholder="Ссылка на обложку или оставьте пустым">
                <input type="file" id="contentThumbFile" accept="image/*">
            </div>

            <div class="form-group">
                <label>Видеофайл (MP4, MKV, WebM)</label>
                <input type="file" id="contentVideoFile" accept="video/*,.mkv">
                <small style="color: #aaa;">Если редактируете только обложку/текст, файл заново выбирать не нужно.</small>
            </div>

            <div class="modal-actions">
                <div class="modal-buttons-right">
                    <button class="btn" id="closeAdminBtn">Отмена</button>
                    <button class="btn btn-primary" id="saveContentBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: CREATE / EDIT CHANNEL -->
    <div class="modal" id="channelModal">
        <div class="modal-content">
            <h2 id="channelModalTitle">Создать новый канал</h2>
            <input type="hidden" id="editChannelId" value="">

            <div class="form-group">
                <label>Название канала</label>
                <input type="text" id="newChName" placeholder="Мой игровой канал">
            </div>
            <div class="form-group">
                <label>Подписчики</label>
                <input type="text" id="newChSubs" placeholder="Например: 150 тыс.">
            </div>
            <div class="form-group">
                <label>Аватарка (URL)</label>
                <input type="text" id="newChAvatar" placeholder="Ссылка на аватарку">
            </div>
            <div class="form-group">
                <label>Баннер (URL)</label>
                <input type="text" id="newChBanner" placeholder="Ссылка на баннер">
            </div>

            <div class="modal-actions">
                <button class="btn btn-danger" id="deleteChannelBtn" style="display: none;">Удалить канал</button>
                <div class="modal-buttons-right">
                    <button class="btn" id="closeChannelBtn">Отмена</button>
                    <button class="btn btn-primary" id="saveChannelBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: VIDEO PLAYER -->
    <div class="modal" id="playerModal">
        <div class="modal-content player-modal-content">
            <video id="mainVideoPlayer" controls autoplay></video>
            <h3 id="playerTitle" style="margin-top: 10px;"></h3>
            <p id="playerStats" style="color: #aaa; font-size: 0.9rem; margin-top: 4px;"></p>
            <div class="modal-actions" style="margin-top: 15px;">
                <div class="modal-buttons-right">
                    <button class="btn" id="closePlayerBtn">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           INDEXEDDB: ХРАНЕНИЕ ТЯЖЕЛЫХ ВИДЕОФАЙЛОВ С УНИКАЛЬНЫМИ КЛЮЧАМИ
           ========================================================================== */
        const DB_NAME = 'YouSimulatorDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'videos';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveVideoFile(videoId, fileBlob) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ id: videoId, blob: fileBlob });
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }

        async function getVideoFile(videoId) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.get(videoId);
                request.onsuccess = () => resolve(request.result ? request.result.blob : null);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function deleteVideoFile(videoId) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(videoId);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }

        /* ==========================================================================
           STATE & LOCALSTORAGE (С МИГРАЦИЕЙ СТАРЫХ ДАННЫХ)
           ========================================================================== */
        let channels = JSON.parse(localStorage.getItem('yt_channels')) || [];
        let videos = JSON.parse(localStorage.getItem('yt_videos')) || [];
        let currentChannelId = localStorage.getItem('yt_current_channel') || '';

        function initAndMigrateData() {
            if (channels.length === 0) {
                channels.push({
                    id: 'ch_default_' + Date.now(),
                    name: 'Мой Главный Канал',
                    avatar: 'https://via.placeholder.com/80/3f3f3f/ffffff?text=Avatar',
                    banner: 'https://via.placeholder.com/800x180/272727/ffffff?text=Banner',
                    subscribers: '100 тыс.'
                });
                localStorage.setItem('yt_channels', JSON.stringify(channels));
            }

            if (!currentChannelId || !channels.find(c => c.id === currentChannelId)) {
                currentChannelId = channels[0].id;
                localStorage.setItem('yt_current_channel', currentChannelId);
            }

            let updated = false;
            videos = videos.map((v, index) => {
                if (!v.channelId) {
                    v.channelId = channels[0].id;
                    updated = true;
                }
                if (!v.id) {
                    v.id = 'vid_' + Date.now() + '_' + index;
                    updated = true;
                }
                return v;
            });

            if (updated) {
                localStorage.setItem('yt_videos', JSON.stringify(videos));
            }
        }

        initAndMigrateData();

        /* ==========================================================================
           UI RENDERERS & NAVIGATION
           ========================================================================== */
        let activeTab = 'videos';

        function saveState() {
            localStorage.setItem('yt_channels', JSON.stringify(channels));
            localStorage.setItem('yt_videos', JSON.stringify(videos));
            localStorage.setItem('yt_current_channel', currentChannelId);
        }

        function populateChannelSelects() {
            const mainSelect = document.getElementById('channelSelect');
            const adminSelect = document.getElementById('adminChannelSelect');

            mainSelect.innerHTML = '';
            adminSelect.innerHTML = '';

            channels.forEach(ch => {
                const opt = document.createElement('option');
                opt.value = ch.id;
                opt.textContent = ch.name;
                if (ch.id === currentChannelId) opt.selected = true;
                mainSelect.appendChild(opt);

                const optAdmin = opt.cloneNode(true);
                adminSelect.appendChild(optAdmin);
            });
        }

        function getCurrentChannel() {
            return channels.find(c => c.id === currentChannelId) || channels[0];
        }

        function renderChannelHeader() {
            const ch = getCurrentChannel();
            if (!ch) return;
            document.getElementById('chBanner').src = ch.banner || 'https://via.placeholder.com/800x180/272727/ffffff?text=Banner';
            document.getElementById('chAvatar').src = ch.avatar || 'https://via.placeholder.com/80/3f3f3f/ffffff?text=Avatar';
            document.getElementById('chName').textContent = ch.name;
            document.getElementById('chSubs').textContent = (ch.subscribers || '0') + ' подписчиков';
        }

        function createVideoCard(video, showEditBtn = false) {
            const card = document.createElement('div');
            card.className = 'video-card';

            const thumbUrl = video.thumbnail || 'https://via.placeholder.com/320x180/272727/ffffff?text=No+Thumbnail';

            card.innerHTML = `
                <div class="thumbnail-container">
                    <img src="${thumbUrl}" class="thumbnail" alt="Thumb">
                </div>
                <div class="video-info">
                    <div class="video-title">${video.title}</div>
                    <div class="video-stats">${video.views} • ${video.date || 'Недавно'}</div>
                </div>
            `;

            card.addEventListener('click', (e) => {
                if (!e.target.classList.contains('btn-edit') && !e.target.classList.contains('btn-delete')) {
                    playVideo(video.id);
                }
            });

            if (showEditBtn) {
                const actions = document.createElement('div');
                actions.className = 'card-actions';
                
                const editBtn = document.createElement('button');
                editBtn.className = 'btn btn-sm btn-edit';
                editBtn.textContent = '✏️ Изменить';
                editBtn.addEventListener('click', () => openAdminModalForEdit(video.id));

                const delBtn = document.createElement('button');
                delBtn.className = 'btn btn-sm btn-delete';
                delBtn.style.marginLeft = '6px';
                delBtn.textContent = '🗑️ Удалить';
                delBtn.addEventListener('click', () => deleteContent(video.id));

                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                card.appendChild(actions);
            }

            return card;
        }

        function renderHomeFeed() {
            const grid = document.getElementById('homeVideoGrid');
            grid.innerHTML = '';
            
            if (videos.length === 0) {
                grid.innerHTML = '<p style="color: #aaa;">Пока нет загруженных видео.</p>';
                return;
            }

            videos.forEach(v => {
                grid.appendChild(createVideoCard(v, false));
            });
        }

        function renderChannelVideos() {
            const grid = document.getElementById('channelVideoGrid');
            grid.innerHTML = '';

            const filtered = videos.filter(v => v.channelId === currentChannelId && (v.type || 'video') === activeTab);

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color: #aaa;">На этом канале пока нет ${activeTab === 'videos' ? 'видео' : 'стримов'}.</p>`;
                return;
            }

            filtered.forEach(v => {
                grid.appendChild(createVideoCard(v, true));
            });
        }

        /* ==========================================================================
           VIDEO PLAYER ACTIONS
           ========================================================================== */
        async function playVideo(videoId) {
            const videoData = videos.find(v => v.id === videoId);
            if (!videoData) return;

            const playerModal = document.getElementById('playerModal');
            const videoElem = document.getElementById('mainVideoPlayer');

            document.getElementById('playerTitle').textContent = videoData.title;
            document.getElementById('playerStats').textContent = `${videoData.views} • ${videoData.date || 'Сегодня'}`;

            const blob = await getVideoFile(videoId);
            if (blob) {
                videoElem.src = URL.createObjectURL(blob);
            } else {
                videoElem.src = '';
                alert('Видеофайл не найден в локальном хранилище.');
            }

            playerModal.classList.add('active');
        }

        document.getElementById('closePlayerBtn').addEventListener('click', () => {
            const playerModal = document.getElementById('playerModal');
            const videoElem = document.getElementById('mainVideoPlayer');
            videoElem.pause();
            videoElem.src = '';
            playerModal.classList.remove('active');
        });

        /* ==========================================================================
           ADMIN PANEL: ADD / EDIT / DELETE CONTENT
           ========================================================================== */
        const adminModal = document.getElementById('adminModal');

        document.getElementById('openAdminBtn').addEventListener('click', () => {
            document.getElementById('modalTitle').textContent = 'Добавить контент';
            document.getElementById('editVideoId').value = '';
            document.getElementById('contentTitle').value = '';
            document.getElementById('contentViews').value = '';
            document.getElementById('contentThumbnail').value = '';
            document.getElementById('contentThumbFile').value = '';
            document.getElementById('contentVideoFile').value = '';
            adminModal.classList.add('active');
        });

        document.getElementById('closeAdminBtn').addEventListener('click', () => {
            adminModal.classList.remove('active');
        });

        function openAdminModalForEdit(videoId) {
            const v = videos.find(item => item.id === videoId);
            if (!v) return;

            document.getElementById('modalTitle').textContent = 'Редактировать контент';
            document.getElementById('editVideoId').value = v.id;
            document.getElementById('adminChannelSelect').value = v.channelId || currentChannelId;
            document.getElementById('contentType').value = v.type || 'video';
            document.getElementById('contentTitle').value = v.title;
            document.getElementById('contentViews').value = v.views;
            document.getElementById('contentThumbnail').value = v.thumbnail || '';
            document.getElementById('contentThumbFile').value = '';
            document.getElementById('contentVideoFile').value = '';

            adminModal.classList.add('active');
        }

        async function deleteContent(videoId) {
            if (confirm('Вы уверены, что хотите удалить этот контент?')) {
                videos = videos.filter(v => v.id !== videoId);
                await deleteVideoFile(videoId);
                saveState();
                renderChannelVideos();
                renderHomeFeed();
            }
        }

        document.getElementById('saveContentBtn').addEventListener('click', async () => {
            const editId = document.getElementById('editVideoId').value;
            const targetChannelId = document.getElementById('adminChannelSelect').value;
            const type = document.getElementById('contentType').value;
            const title = document.getElementById('contentTitle').value.trim();
            const views = document.getElementById('contentViews').value.trim() || '0 просмотров';
            let thumbnail = document.getElementById('contentThumbnail').value.trim();

            if (!title) {
                alert('Пожалуйста, введите название!');
                return;
            }

            const thumbFileInput = document.getElementById('contentThumbFile');
            if (thumbFileInput.files && thumbFileInput.files[0]) {
                thumbnail = await new Promise((res) => {
                    const reader = new FileReader();
                    reader.onload = (e) => res(e.target.result);
                    reader.readAsDataURL(thumbFileInput.files[0]);
                });
            }

            const videoFileInput = document.getElementById('contentVideoFile');
            const newVideoFile = videoFileInput.files[0];

            if (editId) {
                const index = videos.findIndex(v => v.id === editId);
                if (index !== -1) {
                    videos[index].channelId = targetChannelId;
                    videos[index].type = type;
                    videos[index].title = title;
                    videos[index].views = views;
                    if (thumbnail) videos[index].thumbnail = thumbnail;

                    if (newVideoFile) {
                        await saveVideoFile(editId, newVideoFile);
                    }
                }
            } else {
                const uniqueId = 'vid_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

                if (newVideoFile) {
                    await saveVideoFile(uniqueId, newVideoFile);
                }

                const newVideoObj = {
                    id: uniqueId,
                    channelId: targetChannelId,
                    type: type,
                    title: title,
                    views: views,
                    thumbnail: thumbnail || 'https://via.placeholder.com/320x180/272727/ffffff?text=No+Thumbnail',
                    date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })
                };

                videos.push(newVideoObj);
            }

            saveState();
            adminModal.classList.remove('active');
            renderChannelVideos();
            renderHomeFeed();
        });

        /* ==========================================================================
           CHANNEL MANAGEMENT (CREATE / EDIT / DELETE CHANNEL)
           ========================================================================== */
        const channelModal = document.getElementById('channelModal');
        const deleteChannelBtn = document.getElementById('deleteChannelBtn');

        // Создать новый канал
        document.getElementById('addChannelBtn').addEventListener('click', () => {
            document.getElementById('channelModalTitle').textContent = 'Создать новый канал';
            document.getElementById('editChannelId').value = '';
            document.getElementById('newChName').value = '';
            document.getElementById('newChSubs').value = '0';
            document.getElementById('newChAvatar').value = '';
            document.getElementById('newChBanner').value = '';
            deleteChannelBtn.style.display = 'none';
            channelModal.classList.add('active');
        });

        // Редактировать текущий канал
        document.getElementById('editChannelSettingsBtn').addEventListener('click', () => {
            const ch = getCurrentChannel();
            if (!ch) return;

            document.getElementById('channelModalTitle').textContent = 'Настройки канала';
            document.getElementById('editChannelId').value = ch.id;
            document.getElementById('newChName').value = ch.name;
            document.getElementById('newChSubs').value = ch.subscribers || '0';
            document.getElementById('newChAvatar').value = ch.avatar || '';
            document.getElementById('newChBanner').value = ch.banner || '';
            deleteChannelBtn.style.display = 'block';
            channelModal.classList.add('active');
        });

        document.getElementById('closeChannelBtn').addEventListener('click', () => {
            channelModal.classList.remove('active');
        });

        // Сохранить канал (создание или редактирование)
        document.getElementById('saveChannelBtn').addEventListener('click', () => {
            const editId = document.getElementById('editChannelId').value;
            const name = document.getElementById('newChName').value.trim();
            const subs = document.getElementById('newChSubs').value.trim() || '0';
            const avatar = document.getElementById('newChAvatar').value.trim();
            const banner = document.getElementById('newChBanner').value.trim();

            if (!name) {
                alert('Введите название канала!');
                return;
            }

            if (editId) {
                // РЕДАКТИРОВАНИЕ
                const index = channels.findIndex(c => c.id === editId);
                if (index !== -1) {
                    channels[index].name = name;
                    channels[index].subscribers = subs;
                    channels[index].avatar = avatar || 'https://via.placeholder.com/80/3f3f3f/ffffff?text=' + encodeURIComponent(name[0]);
                    channels[index].banner = banner || 'https://via.placeholder.com/800x180/272727/ffffff?text=' + encodeURIComponent(name);
                }
            } else {
                // СОЗДАНИЕ
                const newCh = {
                    id: 'ch_' + Date.now(),
                    name: name,
                    subscribers: subs,
                    avatar: avatar || 'https://via.placeholder.com/80/3f3f3f/ffffff?text=' + encodeURIComponent(name[0]),
                    banner: banner || 'https://via.placeholder.com/800x180/272727/ffffff?text=' + encodeURIComponent(name)
                };
                channels.push(newCh);
                currentChannelId = newCh.id;
            }

            saveState();
            populateChannelSelects();
            renderChannelHeader();
            renderChannelVideos();
            channelModal.classList.remove('active');
        });

        // Удалить канал
        deleteChannelBtn.addEventListener('click', async () => {
            const editId = document.getElementById('editChannelId').value;
            if (!editId) return;

            if (confirm('Вы уверены, что хотите полностью удалить этот канал и весь его контент?')) {
                // Удаляем все видео этого канала и их файлы из IndexedDB
                const channelVideos = videos.filter(v => v.channelId === editId);
                for (const v of channelVideos) {
                    await deleteVideoFile(v.id);
                }
                videos = videos.filter(v => v.channelId !== editId);

                // Удаляем сам канал
                channels = channels.filter(c => c.id !== editId);

                if (channels.length > 0) {
                    currentChannelId = channels[0].id;
                } else {
                    currentChannelId = '';
                    initAndMigrateData(); // Пересоздаст базовый канал, если удалили последний
                }

                saveState();
                populateChannelSelects();
                renderChannelHeader();
                renderChannelVideos();
                renderHomeFeed();
                channelModal.classList.remove('active');
            }
        });

        document.getElementById('channelSelect').addEventListener('change', (e) => {
            currentChannelId = e.target.value;
            saveState();
            renderChannelHeader();
            renderChannelVideos();
        });

        /* ==========================================================================
           TAB & VIEW SWITCHING
           ========================================================================== */
        const viewHome = document.getElementById('viewHome');
        const viewChannel = document.getElementById('viewChannel');
        const navHome = document.getElementById('navHome');
        const navChannel = document.getElementById('navChannel');

        function switchView(view) {
            if (view === 'home') {
                viewHome.style.display = 'block';
                viewChannel.style.display = 'none';
                navHome.classList.add('active');
                navChannel.classList.remove('active');
                renderHomeFeed();
            } else {
                viewHome.style.display = 'none';
                viewChannel.style.display = 'block';
                navHome.classList.remove('active');
                navChannel.classList.add('active');
                renderChannelHeader();
                renderChannelVideos();
            }
        }

        document.getElementById('goHomeBtn').addEventListener('click', () => switchView('home'));
        navHome.addEventListener('click', () => switchView('home'));
        navChannel.addEventListener('click', () => switchView('channel'));

        const tabVideos = document.getElementById('tabVideos');
        const tabStreams = document.getElementById('tabStreams');

        tabVideos.addEventListener('click', () => {
            activeTab = 'videos';
            tabVideos.classList.add('active');
            tabStreams.classList.remove('active');
            renderChannelVideos();
        });

        tabStreams.addEventListener('click', () => {
            activeTab = 'streams';
            tabStreams.classList.add('active');
            tabVideos.classList.remove('active');
            renderChannelVideos();
        });

        /* ==========================================================================
           INITIALIZATION
           ========================================================================== */
        populateChannelSelects();
        switchView('home');
    </script>
</body>
</html>
